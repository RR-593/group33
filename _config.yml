title: Group 33 exhibition sandbox
description: >-
  A public student sandbox for an accessible archaeology exhibition website.
lang: en-AU
url: "https://hannahvogelarchaeology.github.io"
baseurl: "/group33"
repository: HannahVogelArchaeology/group33

author: Group 33

header_pages:
  - index.md
  - exhibition.html
  - about.md
  - team.md

# The exhibition sub-site at /exhibition/. It has its own title and its own
# standalone layouts, so it does not use site.title or the Minima chrome.
exhibition:
  title: "Disability in the Ancient World"
  description: >-
    An exhibition about disabled people in Egypt, Greece, Rome and Roman Gaul,
    told through the objects they left behind.

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - AGENTS.md
  - CLAUDE.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
