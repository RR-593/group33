title: 'Disability Heritage: Archaeology with Difference'
# Search results and share previews (jekyll-seo-tag). `tagline` follows the title on the
# home page tab; `description` is used by any page without its own. Both from the curator's
# master doc (docs/HannasMasterDoc.md, Home page): CHECK wording with the curator.
tagline: Curated by Hannah Vogel
description: >-
  Disability is part of our history. However, archaeology is often ableist, overlooking,
  or worse, devaluing disabled experiences. This display invites you to think differently.
lang: en-AU
url: "rr-593.github.io"
baseurl: "/group33"
repository: RR-593/group33

# CHECK: who the group wants credited as author in search engine data
author:
  name: Group 33
  type: Organization

header_pages:
  - pages/index.md
  - pages/shelves/top.md
  - pages/shelves/middle.md
  - pages/shelves/bottom.md
  - pages/curation.md
  - pages/accessibility.md

# Shelf order on the home page and /shelves/; each key matches _data/shelves/<key>.yml
shelves: [top, middle, bottom]

# Gallery tablet mode (assets/js/kiosk.js): off until a device opens the site with
# ?kiosk=on and confirms. Then, after idle_seconds with no touch or key, a warning
# gives warning_seconds to stay before the site goes back to the home page.
kiosk:
  idle_seconds: 120
  warning_seconds: 20

# Widths (px) of the resized photo copies used by shelf pages. Read by
# the Rakefile (`rake images`) and _layouts/shelf.html; the largest is the fallback src.
# After changing, restart `bundle exec rake serve` (it makes the new sizes first).
image_sizes: [400, 800, 1600]

# keep straight quotes in Markdown pages, as copied from the curator's master doc
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-seo-tag

exclude:
  - AGENTS.md
  - CLAUDE.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
  - Rakefile
  - docs
