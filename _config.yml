title: 'Disability Heritage: Archaeology with Difference'
description: >-
  A public student sandbox for an accessible archaeology exhibition website.
lang: en-AU
url: "https://hannahvogelarchaeology.github.io"
baseurl: "/group33"
repository: HannahVogelArchaeology/group33

author: Group 33

header_pages:
  - pages/index.md
  - pages/shelves/top.md
  - pages/shelves/middle.md
  - pages/shelves/bottom.md
  - pages/curation.md

# Shelf order on the home page and /shelves/; each key matches _data/shelves/<key>.json
shelves: [top, middle, bottom]

# Widths (px) of the resized photo copies used by shelf pages. Read by
# the Rakefile (`rake images`) and _layouts/shelf.html; the largest is the fallback src.
# After changing, restart `bundle exec rake serve` (it makes the new sizes first).
image_sizes: [400, 800, 1600]

# keep straight quotes in Markdown pages, as copied from the curator's master doc
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-seo-tag

exclude:
  - AGENTS.md
  - CLAUDE.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
  - Rakefile
  - docs
