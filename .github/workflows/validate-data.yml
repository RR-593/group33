# Checks the shelf JSON in _data/shelves/ against _data/schemas/shelf.schema.json,
# whenever data or this workflow changes. Validating also catches JSON that won't parse.
name: Validate data

on:
  push:
    branches: [main]
    paths: ["_data/**", ".github/workflows/validate-data.yml"]
  pull_request:
    paths: ["_data/**", ".github/workflows/validate-data.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECK_JSONSCHEMA: check-jsonschema==0.38.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the schema itself is valid
        run: pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema --check-metaschema _data/schemas/*.json

      - name: Check every shelf against the schema
        run: pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema --schemafile _data/schemas/shelf.schema.json _data/shelves/*.json
