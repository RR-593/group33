# Audits every built page on desktop and mobile: Lighthouse scores plus an axe-core
# WCAG 2.2 A/AA check (_scripts/axe-report.mjs). Results show on the pull request and
# in the job summary, and full reports are saved as run artifacts. Never blocks merging.
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-device:
    name: audit (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false  # one device failing still reports the other
      matrix:
        # Performance varies between runs on shared CI machines, and mobile simulates a
        # slow phone on a slow network, so its pass mark is lower
        include:
          - device: desktop
            min-performance: "95"
          - device: mobile
            min-performance: "80"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # same setup and build as pages.yml, so the audit sees what visitors get
      - name: Prepare site
        uses: ./.github/actions/prepare-site

      # site goes to $RUNNER_TEMP/site, served at http://127.0.0.1:4173/group33/;
      # reports collect in $RUNNER_TEMP/reports
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site/group33"

      - name: Serve site
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/site" > /dev/null 2>&1 &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/group33/ > /dev/null

      # every built page, so new pages are audited without editing this file
      - name: List pages
        id: pages
        working-directory: ${{ runner.temp }}/site
        run: |
          paths=$(find group33 -name index.html | sed 's|index\.html$||' | sort)
          echo "Auditing:" $paths
          echo "paths=$(echo $paths)" >> "$GITHUB_OUTPUT"
          echo "urls=$(printf 'http://127.0.0.1:4173/%s,' $paths | sed 's/,$//')" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _scripts/package-lock.json

      - name: Install WCAG checker
        run: npm ci --prefix _scripts

      - name: Check WCAG 2.2 A/AA (axe-core)
        id: axe
        env:
          AXE_OUT: ${{ runner.temp }}/reports
        run: CHROME="$(command -v google-chrome)" node _scripts/axe-report.mjs http://127.0.0.1:4173 ${{ matrix.device }} ${{ steps.pages.outputs.paths }}

      - name: Run Lighthouse
        id: lighthouse
        uses: foo-software/lighthouse-check-action@a80267da2e0244b8a2e457a8575fc47590615852 # v12.0.1
        with:
          device: ${{ matrix.device }}
          outputDirectory: ${{ runner.temp }}/reports
          urls: ${{ steps.pages.outputs.urls }}

      - name: Check Lighthouse pass marks
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'success' }}
        uses: foo-software/lighthouse-check-status-action@2b9d5101f7a0de86ddb153a0d77ad7046aac1052 # v3.0.1
        with:
          lighthouseCheckResults: ${{ steps.lighthouse.outputs.lighthouseCheckResults }}
          minAccessibilityScore: "100"
          minBestPracticesScore: "100"
          minPerformanceScore: ${{ matrix.min-performance }}
          minSeoScore: "100"

      - name: Fail on WCAG failures
        if: ${{ !cancelled() && steps.axe.outcome == 'success' && steps.axe.outputs.failures != '0' }}
        run: |
          echo "::error::${{ steps.axe.outputs.failures }} WCAG failure(s) on ${{ matrix.device }}. See the job summary for criterion, page and element."
          exit 1

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.device }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: error

  # The ruleset on main requires a check named "audit". It passes at once, so a pull
  # request can merge without waiting; "audit (desktop)" and "audit (mobile)" above
  # still show their results on the pull request as a warning.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit does not block merging
        run: echo "See the audit (desktop) and audit (mobile) checks for results."

  # One comment per pull request with both devices' WCAG tables, updated on each run
  comment:
    needs: audit-device
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read          # download this run's reports
      pull-requests: write   # post the comment
    steps:
      - name: Post WCAG results on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'lighthouse-reports-*' --dir reports || true
          for device in desktop mobile; do
            report="reports/lighthouse-reports-$device/wcag-$device.md"
            if [ -f "$report" ]; then
              cat "$report"
            else
              printf '## WCAG check: %s\n\nNo report; the audit stopped before the check. See the run.\n\n' "$device"
            fi
          done > comment.md
          printf 'Full Lighthouse reports: [this run](%s), under Artifacts.\n' "$RUN_URL" >> comment.md

          # GitHub comments max out at 65,536 characters
          if [ "$(wc -c < comment.md)" -gt 60000 ]; then
            head -c 60000 comment.md > short.md
            printf '\n\n…cut short. The full tables are on [this run](%s).\n' "$RUN_URL" >> short.md
            mv short.md comment.md
          fi
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
